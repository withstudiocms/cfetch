name: CI - Push to Main

on:
  workflow_dispatch:
    inputs:
      importAll:
        default: false
        required: false
        type: boolean
        description: Enable, if you want to import all TODOs. Runs on checked out branch! Only use if you're sure what you are doing. (requires run_todo_bot to be true)
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  issues: write
  repository-projects: read
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  format:
    name: Format Code
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.STUDIOCMS_SERVICE_TOKEN }}

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@main

      - name: Format code
        run: pnpm run lint:fix

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "[ci] lint"
          branch: ${{ github.head_ref }}
          commit_user_name: studiocms-no-reply
          commit_user_email: no-reply@studiocms.dev
          commit_author: StudioCMS <no-reply@studiocms.dev>

  todo-auto-issue:
    name: Create issues from TODOs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Todo Issue Bot
        uses: juulsn/todo-issue@main
        with:
          excludePattern: "^(node_modules/)"
          autoAssign: false
        env:
          GITHUB_TOKEN: ${{ secrets.STUDIOCMS_SERVICE_TOKEN }}

  mergebot:
    name: Merge Bot
    if: ${{ github.repository_owner == 'withstudiocms' && github.event_name != 'workflow_dispatch' && github.event.commits[0].message != '[ci] lint' }}
    uses: withstudiocms/automations/.github/workflows/mergebot.yml@main
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MERGEBOT }}

  preview-main:
    name: Continuous Deployment Snapshot
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
    uses: withstudiocms/automations/.github/workflows/preview.yml@18ae9dbfa56fd5d58b71b3e196261eac79460518 # main
    with:
      build-cmd: "pnpm ci:build"

  changeset-release:
    name: Changeset Release
    runs-on: ubuntu-latest
    steps:
      - name: Setup Apollo Git Bot
        id: bot-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.STUDIOCMS_GIT_BOT_APP_ID }}
          private-key: ${{ secrets.STUDIOCMS_GIT_BOT_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@main

      - name: Run Build
        run: pnpm ci:prepublish

      - name: Setup git user
        shell: bash
        run: |
          git config --global user.name "apollo-git-bot[bot]"
          git config --global user.email "234251158+apollo-git-bot[bot]@users.noreply.github.com"

      - name: Run Changeset Release
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          # If USE_GITHUB_BOT is true we don't want Changesets to do anything user related
          setupGitUser: false
          commit: "👷 [ci]: Version Packages"
          title: "👷 [ci]: Ready for Release"
          version: pnpm ci:version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Add Label to CI PR
        if: ${{ steps.changesets.outputs.hasChangesets == 'true' }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Adding 'ci' label to PR: $PR_URL"
            if gh pr edit "$PR_URL" --add-label "ci"; then
              echo "Successfully added label to PR"
            else
              echo "Failed to add label to PR, but continuing workflow"
            fi
          else
            echo "No PR URL available, skipping label addition"
          fi
        shell: bash
        env:
          PR_URL: ${{ steps.changesets.outputs.pull_request_url }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Publish to jsr.io
        if: steps.changesets.outputs.published == 'true'
        run: pnpx @qingshaner/jsr-release publish --changesetReleases='${{ steps.changesets.outputs.publishedPackages }}'

      - name: Initiate Release Bot
        if: ${{ steps.changesets.outputs.published == 'true' }}
        uses: withstudiocms/automations/.github/actions/releasebot@main
        with:
          repository: ${{ github.repository }}
          CWD: ${{ github.workspace }}
          PublishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          RoleMentionId: "1309310416362537020"
