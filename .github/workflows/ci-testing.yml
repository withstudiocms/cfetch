name: CI - Tests PRs & Main

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/**"
      - "vitest.config.mts"
    branches: [main]
  pull_request:
    paths:
      - "packages/**"
      - "vitest.config.mts"
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: testing-${{ github.ref }}

jobs:
  typecheck:
    name: Type Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: ["cfetch"]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run ${{ matrix.cmd }} TypeCheck
        uses: ./.github/actions/type-check
        with:
          cmd: ${{ matrix.cmd }}

  effect-check:
    name: Effect Diagnostics
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: ["cfetch"]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run ${{ matrix.cmd }} Effect Diagnostics
        uses: ./.github/actions/effect-check
        with:
          cmd: ${{ matrix.cmd }}

  jsr-dry-run:
    name: Test JSR Publish
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Check out code using Git
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@f32588d80ce35d57905264f7fa473b0f6e297c0a # main

      - name: Build package
        run: pnpm build

      - name: Test run
        run: pnpm jsr:test

  vitest-reporter:
    name: Run Vitest Tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Check out code using Git
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@f32588d80ce35d57905264f7fa473b0f6e297c0a # main

      - name: Build package
        run: pnpm build

      - name: Run Vitest Tests
        run: pnpm ci:test

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-report
          path: html
          retention-days: 14
